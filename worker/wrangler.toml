name = "lock-in-reminders"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Check for due reminders every minute.
[triggers]
crons = ["* * * * *"]

# Create with: npx wrangler kv namespace create KV  -> paste the id below.
[[kv_namespaces]]
binding = "KV"
id = "2939183ce360419ebbdabffcea56ba87"

[vars]
# Public half of the VAPID key pair (npm run vapid prints it).
VAPID_PUBLIC_KEY = "BAuPxJvbt4uWMcGMU2hrGW10plGUpLezJPf5CkSeVme1ih3JE7_7jOtjETXH6dZU18j0d-XPSjKQniWIO53dD1I"
VAPID_SUBJECT = "mailto:you@example.com"
# Lock this to your app's URL once deployed, e.g. https://lock-in.pages.dev
ALLOWED_ORIGIN = "*"

# Private key is a secret:  npx wrangler secret put VAPID_PRIVATE_JWK
